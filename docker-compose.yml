services:
  typedb:
    # If you upgrade this image past 3.3, bump typedb-driver in requirements.txt (protocol must match).
    image: typedb/typedb:3.3.0
    container_name: orgsim-typedb
    ports:
      - "1729:1729"
    volumes:
      - typedb_data:/opt/typedb/server/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:1729/ || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  neo4j:
    image: neo4j:5.15-community
    container_name: orgsim-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/orgsimpass
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  nats:
    image: nats:2.10-alpine
    container_name: orgsim-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--jetstream", "--http_port", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:1.24
    container_name: orgsim-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=sqlite
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "temporal workflow list --address localhost:7233 > /dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 8
      start_period: 45s

  ollama:
    image: ollama/ollama:latest
    container_name: orgsim-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  simulation:
    build:
      context: .
      dockerfile: Simulation/Dockerfile
    container_name: orgsim-simulation
    ports:
      - "8001:8001"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - TYPEDB_URI=typedb:1729
      - ORGSIM_CONFIG=/app/infra/config.yaml
      - LLM_MODEL_NAME=${ORGSIM_OLLAMA_MODEL:-qwen2.5:14b}
    depends_on:
      typedb:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  typedb_data:
  neo4j_data:
  ollama_data:

networks:
  default:
    name: orgsim-network
